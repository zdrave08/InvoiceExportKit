name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore InvoiceExportKit.sln

      - name: Build
        run: dotnet build InvoiceExportKit.sln --configuration Release --no-restore

      - name: Test (net8.0 and net10.0)
        run: dotnet test InvoiceExportKit.sln --configuration Release --no-build --verbosity normal

      - name: Check packages contain both target frameworks
        run: |
          set -e
          for p in src/*/bin/Release/*.nupkg; do
            echo "$p"
            unzip -l "$p" | grep -q "lib/net8.0/"  || { echo "missing lib/net8.0 in $p";  exit 1; }
            unzip -l "$p" | grep -q "lib/net10.0/" || { echo "missing lib/net10.0 in $p"; exit 1; }
          done
